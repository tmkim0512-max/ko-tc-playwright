name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "공개 데모 사이트 대상 라이브 실행"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pytest
      - name: convert (생성물이 커밋본과 같은지 확인)
        run: |
          # 종료 코드 1 = PARTIAL 있음. 07·08 은 의도적 PARTIAL 이라 1 이 정상이고, 2(파싱 오류)만 실패다.
          python -m tc2pw convert examples/tc --uimap examples/uimap.yaml --out generated || [ $? -eq 1 ]
          git diff --exit-code -- generated/

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: unit
    runs-on: ubuntu-latest
    env:
      TI_PASSWORD: SuperSecretPassword!  # 데모 사이트가 로그인 화면에 공개해 둔 값
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: run generated tests
        # 04·05·06 은 의도적 FAIL·BLOCKED·INCONCLUSIVE 재현이라 pytest 는 non-zero 로 끝난다. 판정은 report 가 한다.
        continue-on-error: true
        run: pytest generated -p tc2pw.plugin
      - name: report
        run: python -m tc2pw report generated | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: generated/results.json
