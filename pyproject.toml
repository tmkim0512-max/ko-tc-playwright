[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-tc-playwright"
version = "0.1.0"
description = "한국어 수동 테스트 케이스 → Playwright(pytest) 변환기. 변환률과 실행 판정을 따로 보고한다."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taemin Kim" }]
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "pytest>=7.4", "pytest-playwright>=0.4", "pyyaml>=6"]

[tool.setuptools]
packages = ["tc2pw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
